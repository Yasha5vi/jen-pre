spring:
  application:
    name: backend
  profiles:
    active: docker

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: transaction-service
  prometheus:
    metrics:
      export:
        enabled: true

# Environment: docker (Jenkins CI/CD)
environment: docker

