server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: transaction-service
  prometheus:
    metrics:
      export:
        enabled: true

# Environment: production
environment: production

