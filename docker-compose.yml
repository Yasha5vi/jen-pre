version: '3.8'

services:
  # Nginx Reverse Proxy (Single Entry Point)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - flakes-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      - REACT_APP_ENVIRONMENT=docker
      - REACT_APP_API_BASE_URL=http://localhost/api
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - flakes-network
    restart: unless-stopped

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - ENVIRONMENT=docker
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - flakes-network
    restart: unless-stopped

networks:
  flakes-network:
    driver: bridge

